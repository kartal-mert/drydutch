    <style>
        /* RESET & GENEL */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { height: 100vh; overflow-x: hidden; font-family: "Roboto Condensed", sans-serif; }

        /* NAVBAR */
        .luxury-nav {
            position: fixed; top: 0; left: 0; width: 100%; height: 80px; padding: 0 5%;
            display: flex; justify-content: space-between; align-items: center;
            background: rgba(10, 10, 10, 0.95); backdrop-filter: blur(20px); z-index: 1000;
        }
        .brand-logo { display: flex; align-items: center; gap: 10px; text-decoration: none; }
        .logo-img { height: 60px; border-radius: 50%; }
        .logo-text { color: white; font-size: 18px; letter-spacing: 2px; text-transform: uppercase; font-weight: 600; }

        .nav-menu { display: flex; gap: 30px; }
        .menu-link { color: rgba(255, 255, 255, 0.7); text-decoration: none; text-transform: uppercase; font-size: 14px; transition: 0.3s; }
        .menu-link:hover { color: white; }

        .luxury-hamburger { display: none; flex-direction: column; gap: 5px; background: none; border: none; cursor: pointer; padding: 10px; }
        .luxury-hamburger span { width: 25px; height: 3px; background: white; transition: 0.3s; }

        /* BACKGROUND */
        .tdm-bg-container {
            width: 100%; min-height: 100vh; display: flex; justify-content: center; align-items: center;
            background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
            background-size: 400% 400%; animation: bg 15s ease infinite;
        }
        @keyframes bg { 0% {background-position:0% 50%;} 50% {background-position:100% 50%;} 100% {background-position:0% 50%;} }

        /* MENU LIST */
        .tdm-menu-list { display: flex; gap: 65px; padding: 60px; list-style: none; }
        .tdm-menu-link {
            position: relative; display: flex; align-items: center; width: 290px; height: 100px;
            background: #fff; padding-left: 25px; text-decoration: none;
            transform: rotate(-30deg) skew(25deg); box-shadow: -25px 25px 20px rgba(0,0,0,.22);
            transition: .4s; border-radius: 8px; color: #333;
        }

        /* HOVER RENKLERİ GERİ GELDİ */
        .tdm-menu-item:nth-child(1) .tdm-menu-link:hover { background: #25D366; color: #fff; }
        .tdm-menu-item:nth-child(2) .tdm-menu-link:hover { background: #e1306c; color: #fff; }
        .tdm-menu-item:nth-child(3) .tdm-menu-link:hover { background: #007bb5; color: #fff; }
        .tdm-menu-item:nth-child(4) .tdm-menu-link:hover { background: #ea4335; color: #fff; }

        .tdm-menu-link:hover { transform: rotate(-30deg) skew(25deg) translate(25px,-20px); }
        .tdm-content-box { display: flex; align-items: center; gap: 15px; }
        .tdm-logo { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; }
        .tdm-content-box i { font-size: 36px; }
        .tdm-content-box span { font-size: 18px; font-weight: 700; }

        /* 3D EFEKT */
        .tdm-menu-link:before { content:''; position:absolute; top:14px; left:-28px; width:28px; height:100%; background:#dcdcdc; transform:skewY(-45deg); }
        .tdm-menu-link:after { content:''; position:absolute; bottom:-28px; left:-14px; width:100%; height:28px; background:#b1b1b1; transform:skewX(-45deg); }

        /* MOBİL DÜZENLEMELER */
        @media(max-width: 992px) {
            .tdm-menu-list { flex-direction: column; gap: 50px; }
            .tdm-menu-link { width: 210px; height: 75px; }
        }
        @media (max-width: 768px) {
            .luxury-hamburger { display: flex; }
            .nav-menu {
                position: fixed; top: 80px; right: -100%; width: 100%; height: calc(100vh - 80px);
                background: rgba(10, 10, 10, 0.98); flex-direction: column; align-items: center;
                justify-content: center; gap: 30px; transition: 0.4s;
            }
            .nav-menu.active { right: 0; }
        }
    </style>
</head>
